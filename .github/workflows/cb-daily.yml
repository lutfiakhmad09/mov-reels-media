name: CB Shorts - produksi harian
on:
  schedule:
    - cron: "7 22 * * *"   # 05:07 WIB (produksi utama)
    - cron: "7 3 * * *"    # 10:07 WIB (coba lagi kalau gagal)
    - cron: "37 8 * * *"   # 15:37 WIB (coba lagi setelah kuota Gemini reset)
  workflow_dispatch:
    inputs:
      date: { description: "Tanggal episode (YYYY-MM-DD, kosong = hari ini WIB)", required: false, default: "" }
      dry: { description: "Tes saja (tidak dijadwalkan ke YouTube)", type: boolean, default: true }
      buffer_test: { description: "Tes koneksi Buffer (buat DRAFT, tidak tayang)", type: boolean, default: false }
permissions:
  contents: write
concurrency: { group: cb-shorts, cancel-in-progress: false }
jobs:
  produksi:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q pillow numpy
          git config user.name "lily-bot" && git config user.email "lily-bot@users.noreply.github.com"
      - name: Produksi episode
        env:
          GEMINI_KEYS: ${{ secrets.GEMINI_KEYS }}
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: python3 cb/engine/run_day.py ${{ github.event.inputs.date }} ${{ github.event.inputs.dry == 'true' && '--dry' || '' }} ${{ github.event.inputs.buffer_test == 'true' && '--buffer-test' || '' }}
